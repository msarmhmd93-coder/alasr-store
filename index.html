<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مشغل العسر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand">مشغل العسر</div>
        <nav>
          <a href="#products">المنتجات</a>
          <a href="https://wa.me/781159414" target="_blank">واتساب</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container hero-content">
          <div class="hero-text">
            <p class="eyebrow">معمل عبايات وبراقع ودفايات ونقابات</p>
            <h1>منتجات أنيقة وجاهزة للشراء</h1>
            
            <div class="hero-actions">
              <a href="#products" class="cta-btn">عرض المنتجات</a>
              <a href="https://wa.me/781159414" target="_blank" class="whatsapp-btn">واتساب</a>
            </div>
          </div>
          <div class="hero-card">
            <div class="mini-card">
              <span>منتجاتنا</span>
              <strong id="totalProductsStat">0</strong>
            </div>
            <div class="mini-card">
              <span>المخزون</span>
              <strong id="stockStat">0</strong>
            </div>
          </div>
        </div>
      </section>

      <section id="announcements" class="announcements">
        <div class="container">
          <div class="section-title">
            <p>إعلانات</p>
            <h2>عروض وإعلانات المتجر</h2>
          </div>
          <div id="announcementList" class="announcement-grid"></div>
        </div>
      </section>

      <section id="video-showcase" class="video-showcase">
        <div class="container">
          <div class="section-title">
            <p>عروض الفيديو</p>
            <h2>فيديوهات عرض المنتجات</h2>
          </div>
          <div id="videoList" class="video-grid"></div>
        </div>
      </section>

      <section id="products" class="products">
        <div class="container">
          <div class="section-title">
            <p>منتجاتنا</p>
            <h2>أحدث المنتجات</h2>
          </div>
          <div id="productList" class="product-grid"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>© 2026 مشغل العسر - جميع الحقوق محفوظة</p>
      </div>
    </footer>

    <a class="whatsapp-float" href="https://wa.me/781159414" target="_blank" aria-label="تواصل عبر واتساب">
      WhatsApp
    </a>

    <!-- Cart button & modal -->
    <button id="cartToggle" class="cart-btn" aria-label="سلة المشتريات">سلة (<span id="cartCount">0</span>)</button>

    <div id="cartModal" class="cart-modal" aria-hidden="true">
      <div class="cart-panel">
        <header class="cart-header">
          <h3>سلة المشتريات</h3>
          <button id="closeCart" class="cancel-btn">إغلاق</button>
        </header>
        <div id="cartItems" class="cart-items"></div>
          <div class="cart-actions">
          <button id="clearCart" class="cancel-btn">تفريغ السلة</button>
          <button id="checkoutBtn" class="submit-btn">شراء عبر واتساب</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
